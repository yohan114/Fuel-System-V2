# =============================================================================
#  The proxy body, shared by the :80 and :443 server blocks so the two cannot
#  drift apart.
#
#      sudo mkdir -p /etc/nginx/snippets
#      sudo cp deploy/nginx/fuelsystem-proxy.conf /etc/nginx/snippets/
# =============================================================================

# Correction requests carry a signed running-chart photo or PDF, and
# next.config.ts allows a 12 MB server-action body. nginx defaults to 1 MB and
# would reject those with a 413 before the app ever sees them. Set above the
# app's own limit so the app is the thing that enforces it and returns a
# sensible error, rather than nginx cutting the request off.
client_max_body_size 16m;

# A cold Next.js route can take a moment on first hit; the default 60s read
# timeout is fine for that, but a slow bulk export (770 machines through the
# consumption series) can exceed it.
proxy_read_timeout 180s;
proxy_send_timeout 180s;

location / {
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;

    # $host, not $proxy_host: the app and Next's server-action origin check
    # compare against the hostname the browser used. Passing the upstream name
    # here makes every form submission fail the CSRF origin check while pages
    # keep loading — which reads as a broken form, not a proxy misconfiguration.
    proxy_set_header Host              $host;
    proxy_set_header Upgrade           $http_upgrade;
    # $connection_upgrade, not a literal "upgrade": echoing it on every request
    # breaks keepalive for ordinary page loads. The map is in conf.d.
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # Cloudflare terminates TLS and speaks HTTP to us, so $scheme is "http"
    # here even when the visitor is on HTTPS. Trust Cloudflare's own header
    # when it is present, or the app builds http:// absolute URLs and cookies
    # marked Secure get dropped.
    proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_cache_bypass $http_upgrade;
    proxy_redirect off;
}

# Next's immutable build assets. Fingerprinted filenames, so they can be cached
# hard; without this every page load re-fetches the whole JS bundle from the
# origin over Cloudflare.
location /_next/static/ {
    proxy_pass http://127.0.0.1:3300;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
