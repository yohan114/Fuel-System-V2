# =============================================================================
#  Catch-all for unmatched Host headers.
#
#      sudo cp deploy/nginx/000-catchall.conf /etc/nginx/sites-available/000-catchall
#      sudo ln -sf /etc/nginx/sites-available/000-catchall /etc/nginx/sites-enabled/000-catchall
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Install this BEFORE the fuel vhost, and only after confirming no existing
#  block already carries `default_server` on :80 (`nginx -T | grep default_server`).
#  If one does, skip this file — it would be a duplicate default_server and
#  nginx would refuse to start.
#
#  Why it exists. When nothing declares default_server, nginx makes the first
#  block it parsed the default for that address, and sites-enabled is globbed in
#  sorted order. Adding a file named "fuelsystem" to a box whose only site is
#  "workshopone" therefore moves the default silently: every request with a Host
#  that matches no server_name — a direct hit on the IP, a health check, a
#  scanner, an internal tool using an address rather than a name — stops
#  reaching WorkshopOne and starts rendering the fuel system's login page. It is
#  a 200, so no monitoring fires.
#
#  Making the default explicit and refusing it removes the ambiguity entirely.
#  444 closes the connection without a response, which is the right answer to a
#  request that names no site we host.
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
