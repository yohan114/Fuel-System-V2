# =============================================================================
#  fuelsystem.ec-workshops.online -> 127.0.0.1:3300
#
#  Install:
#      sudo cp deploy/nginx/fuelsystem.conf /etc/nginx/sites-available/fuelsystem
#      sudo ln -sf /etc/nginx/sites-available/fuelsystem /etc/nginx/sites-enabled/fuelsystem
#      sudo rm -f /etc/nginx/sites-enabled/default        # or it wins on port 80
#      sudo nginx -t && sudo systemctl reload nginx
#
#  The TLS block is commented out. Bring the site up on HTTP first, prove it
#  answers, then follow deploy/README.md for the certificate — with Cloudflare
#  in front, the certificate step is not the usual certbot run.
# =============================================================================

# Real client IPs and the $cf_forwarded_proto map live in
# /etc/nginx/conf.d/cloudflare-realip.conf, which Ubuntu's stock nginx.conf
# already pulls in via `include /etc/nginx/conf.d/*.conf`. Do NOT include it
# again from here: `map` may only be declared once, and a second include makes
# nginx refuse to start with "duplicate map". Generate that file first:
#     sudo bash deploy/nginx/cloudflare-realip.sh

server {
    listen 80;
    listen [::]:80;
    server_name fuelsystem.ec-workshops.online;

    # Let's Encrypt HTTP-01, if you take that route. Must stay reachable over
    # plain HTTP and must be matched BEFORE any redirect below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # --- Until TLS is configured, serve directly over HTTP. -----------------
    # Once the certificate is in place, comment this include out and uncomment
    # the redirect and the 443 server block.
    include /etc/nginx/snippets/fuelsystem-proxy.conf;

    # return 301 https://$host$request_uri;
}

